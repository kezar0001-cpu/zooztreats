# Minimal Supabase CLI config for local development.
# Run `supabase start` then `supabase db reset` to apply migrations + seed.

project_id = "zooz-treats"

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true

[auth]
enabled = true
# Disable public sign-ups so only invited admins have accounts.
enable_signup = false
